<!DOCTYPE html>
<html lang="en" id="html">
<head>
 <title>kEEpEd</title>
 <meta charset="utf-8" />
 <meta 
  name="viewport" 
  content="
   width=device-width,
   initial-scale=1.0
  " 
 />
</head>
<script>
u = {};
u.d = document;
u.key_down = function() {
 console.log(event);
};
</script>
<script>
u.find = (id) => document.getElementById(id);
</script>
<script>
u.make_span = (c) => {
 let s = u.d.createElement("span");
 s.textContent = c;
 return s;
};
</script>
<script>
u.add = function(c) {
 const d = u.find("text-container");
 let s = u.make_span(c);
 d.append(s);
};
</script>
<script>
u.key_up = function() {
 let symbols = event.target.value;
 if ( symbols !== ''){
  for(let c of symbols) {
   u.add(c);
  }
  event.target.value = '';
 }
};
</script>
<body 
 style="
  background-color: black;
  margin: 0;
  overflow: hidden;
 " 
>
<div 
 id="text-container"
 style="
  color: lightblue;
 "
>
</div>
<input 
 id="hello"
 style="
  position: absolute; 
  bottom: 2rem; 
  transform-origin: 50% 100%; 
  left: 50%; 
  transform: translate(-50%, 0px);
 "
 onkeydown="u.key_down()"
 onkeyup="u.key_up()"
>
</body>
